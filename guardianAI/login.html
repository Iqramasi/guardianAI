<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Safe Places</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif; /* Changed the font */
    color: #0d0c0c;
    background: linear-gradient(135deg, #f4f9fc, #f8f9fa); 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

header, footer {
    width: 100%;
    background-color: #76bbf7; 
    padding: 5px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    z-index: 1000;
}

header {
    top: 0;
}

footer {
    bottom: 0;
    justify-content: center;
    text-align: center;
}

html, body {
    overflow-y: auto;
}

header h1 {
    font-size: 14px;
    color: #ffffff;
    margin-left: 20px;
}

nav ul {
    list-style: none;
    display: flex;
    margin: 0;
    padding: 0;
}

nav ul li {
    margin: 0 10px;
}

nav ul li a {
    text-decoration: none;
    color: #ffffff;
    font-size: 12px;
    transition: color 0.3s;
}

nav ul li a:hover {
    color: #f8f9fa;
}

.login-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 320px;
    margin-top: 120px;
    animation: fadeIn 1s ease-in-out, float 6s infinite;
    position: relative;
    z-index: 1;
}

.login-container h2 {
    margin-bottom: 20px;
    font-size: 18px;
    color: #76bbf7;
}

.login-container input {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    border: 1px solid #76bbf7;
    border-radius: 5px;
    font-size: 12px;
    box-sizing: border-box;
    background-color: rgba(255, 255, 255, 0.8);
    color: #333333;
    transition: background-color 0.3s;
}

.login-container input:focus {
    background-color: rgba(255, 255, 255, 1);
}

.login-container button {
    width: 100%;
    padding: 8px;
    background: #3d98e8;
    color: #ffffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.3s;
}

.login-container button:hover {
    background: #1fa1ed;
}

.toggle-link {
    margin-top: 12px;
    font-size: 12px;
}

.toggle-link a {
    color: #3d98e8;
    text-decoration: none;
    font-weight: bold;
}

.toggle-link a:hover {
    text-decoration: underline;
}

footer p {
    font-size: 12px;
    color: #ffffff;
    margin: 0;
    text-align: center;
}

/* Floating Animation */
@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

/* Smoky Background */
.login-container::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    bottom: -20px;
    left: -20px;
    background: url('smoky-background.png');
    background-size: cover;
    opacity: 0.1;
    z-index: -1;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes placeholder-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

    </style>
</head>
<body>
    <header>
        <h1>Safe Place</h1>
        <nav>
            <ul>
                <li><a href="page.html">Home</a></li>
                <li><a href="exploremap.html">Explore Map</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login/Signup</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <h2>Login to Safe Places</h2>
        <form>
            <input type="email" placeholder="Enter your email" required>
            <input type="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <p class="toggle-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <footer>
        <p>&copy; 2025 Safe Places | All Rights Reserved</p>
    </footer>
</body>
</html>
