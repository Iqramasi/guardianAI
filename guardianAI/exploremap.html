

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Map</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC3YwSA2vcqqGQ79DkO4GJNlQLM-KLr9UQ&callback=initMap&libraries=places" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to right,#76bbf7,#76bbf7);
            color: rgb(252, 247, 247);
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        p {
            margin-bottom: 20px;
            font-size: 16px;
        }
        #search-box {
            width: 90%;
            max-width: 400px;
            padding: 10px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        #map {
            width: 90%;
            max-width: 1200px;
            height: 70vh;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #form {
            display: none;
            position: absolute;
            top: 20%;
            background: rgb(218, 240, 250);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: black;
        }
        label, select, textarea {
            display: block;
            width: 100%;
            margin: 5px 0;
        }
        button {
            margin-top: 10px;
            padding: 8px;
            background:#76bbf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        


    </style>
</head>
<body>
    <h2>Explore Safety Ratings on the Map</h2>
    <p>Check the safety of locations based on real user experiences.</p>
    <input id="search-box" type="text" placeholder="Search for a location...">
    <div id="map"></div>

    <div id="form">
        <h3>Add Safety Rating</h3>
        <label for="safety">Select Safety Level:</label>
        <select id="safety">
            <option value="green">Safe (Green)</option>
            <option value="orange">Moderate Risk (Orange)</option>
            <option value="red">Unsafe (Red)</option>
        </select>
        <label for="description">Write about this place:</label>
        <textarea id="description" rows="3"></textarea>
        <button onclick="saveMarker()">Save</button>
        <button onclick="closeForm()">Cancel</button>
    </div>

    <script>
        let map;
        let tempLatLng;
        const colors = {
            green: "http://maps.google.com/mapfiles/ms/icons/green-dot.png", 
            orange: "http://maps.google.com/mapfiles/ms/icons/orange-dot.png", 
            red: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
        };

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 12.9716, lng: 77.5946 }, // Default to Bengaluru
                zoom: 12,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#1c1c1c" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#1c1c1c" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#ffffff" }] }
                ]
            });

            map.addListener("click", (event) => {
                tempLatLng = event.latLng;
                document.getElementById("form").style.display = "block";
            });

            const searchBox = new google.maps.places.SearchBox(document.getElementById("search-box"));
            map.controls[google.maps.ControlPosition.TOP_CENTER].push(document.getElementById("search-box"));

            searchBox.addListener("places_changed", () => {
                const places = searchBox.getPlaces();
                if (places.length === 0) return;

                const bounds = new google.maps.LatLngBounds();
                places.forEach(place => {
                    if (!place.geometry) return;
                    bounds.extend(place.geometry.location);
                });
                map.fitBounds(bounds);
            });
        }

        function saveMarker() {
            const safety = document.getElementById("safety").value;
            const description = document.getElementById("description").value;
            document.getElementById("form").style.display = "none";

            const marker = new google.maps.Marker({
                position: tempLatLng,
                map,
                icon: colors[safety]
            });

            const infoWindow = new google.maps.InfoWindow({
                content: `<strong>Safety Level: ${safety}</strong><br>${description}`
            });

            marker.addListener("click", () => {
                infoWindow.open(map, marker);
            });
        }

        function closeForm() {
            document.getElementById("form").style.display = "none";
        }
        



function saveMarker() {
    const userId = localStorage.getItem("userId"); // Retrieve user ID (use login system)
    
    if (!userId) {
        alert("Please log in to add a review.");
        window.location.href = "login.html"; // Redirect to login page after alert
        return;
    }

    const safety = document.getElementById("safety").value;
    const description = document.getElementById("description").value;
    document.getElementById("form").style.display = "none";

    const review = {
        id: Date.now(), // Unique ID for the review
        userId: userId,
        lat: tempLatLng.lat(),
        lng: tempLatLng.lng(),
        safety: safety,
        description: description
    };

    // Save to local storage (for demo, use a database in production)
    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
    reviews.push(review);
    localStorage.setItem("reviews", JSON.stringify(reviews));

    // Add marker to the map
    const marker = new google.maps.Marker({
        position: tempLatLng,
        map,
        icon: colors[safety]
    });

    // Display the review
    displayReviews();
}




function displayReviews() {
    const userId = localStorage.getItem("userId");
    const reviewsContainer = document.getElementById("saved-reviews");
    reviewsContainer.innerHTML = "";

    const reviews = JSON.parse(localStorage.getItem("reviews")) || [];
    reviews.forEach(review => {
        const reviewElement = document.createElement("div");
        reviewElement.className = "saved-review";
        reviewElement.innerHTML = `
            <strong>Safety:</strong> ${review.safety} <br>
            <strong>Description:</strong> ${review.description}
            ${review.userId === userId ? `<button onclick="deleteReview(${review.id})">Delete</button>` : ""}
        `;
        reviewsContainer.appendChild(reviewElement);
    });
}





function deleteReview(reviewId) {
    const userId = localStorage.getItem("userId");
    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    // Filter out reviews that don't belong to the current user
    reviews = reviews.filter(review => !(review.id === reviewId && review.userId === userId));

    localStorage.setItem("reviews", JSON.stringify(reviews));
    displayReviews();
}



    </script>
</body>
</html>
